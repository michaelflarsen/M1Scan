<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Central IP box (top) with rounded corners -->
  <rect x="190" y="40" width="132" height="140" rx="20" ry="20" fill="none" stroke="#5B9FD5" stroke-width="16"/>
  <text x="256" y="130" font-family="Segoe UI, Arial" font-size="60" font-weight="bold" fill="#5B9FD5" text-anchor="middle" dominant-baseline="middle">IP</text>

  <!-- Vertical connector line from central box down -->
  <line x1="256" y1="180" x2="256" y2="230" stroke="#5B9FD5" stroke-width="12"/>

  <!-- Horizontal line from center to child boxes -->
  <line x1="150" y1="230" x2="362" y2="230" stroke="#5B9FD5" stroke-width="12"/>

  <!-- Left device box -->
  <rect x="70" y="230" width="160" height="160" rx="20" ry="20" fill="none" stroke="#5B9FD5" stroke-width="16"/>
  <text x="150" y="320" font-family="Segoe UI, Arial" font-size="60" font-weight="bold" fill="#5B9FD5" text-anchor="middle" dominant-baseline="middle">IP</text>

  <!-- Center device box -->
  <rect x="226" y="230" width="160" height="160" rx="20" ry="20" fill="none" stroke="#5B9FD5" stroke-width="16"/>
  <text x="306" y="320" font-family="Segoe UI, Arial" font-size="60" font-weight="bold" fill="#5B9FD5" text-anchor="middle" dominant-baseline="middle">IP</text>

  <!-- Right device box -->
  <rect x="382" y="230" width="160" height="160" rx="20" ry="20" fill="none" stroke="#5B9FD5" stroke-width="16"/>
  <text x="462" y="320" font-family="Segoe UI, Arial" font-size="60" font-weight="bold" fill="#5B9FD5" text-anchor="middle" dominant-baseline="middle">IP</text>

  <!-- Dotted arrow pointing to the right showing device follow -->
  <g>
    <!-- Dotted curved line -->
    <path d="M 420 100 Q 480 150, 500 200" fill="none" stroke="#5B9FD5" stroke-width="8" stroke-dasharray="20,20" stroke-linecap="round"/>
    <!-- Arrow head -->
    <polygon points="510,210 480,190 495,165" fill="#5B9FD5"/>
  </g>
</svg>
